name: Vercel Playgrounds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Required repository secrets:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID_ELEMENT_PLUS
#   VERCEL_PROJECT_ID_ELEMENT_UI
#
# Vercel projects Root Directory:
#   playgrounds/vue3-element-plus
#   playgrounds/vue2-element-ui

jobs:
  deploy-element-plus:
    name: Element Plus playground
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ELEMENT_PLUS }}
    steps:
      - name: Require Vercel secrets
        run: |
          missing=
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID_ELEMENT_PLUS"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            echo "Add them under repo Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Resolve environment
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project
        working-directory: playgrounds/vue3-element-plus
        run: vercel pull --yes --environment="${{ steps.meta.outputs.environment }}" --token="$VERCEL_TOKEN"

      - name: Build (vercel.json)
        working-directory: playgrounds/vue3-element-plus
        run: vercel build ${{ steps.meta.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        working-directory: playgrounds/vue3-element-plus
        run: vercel deploy --prebuilt ${{ steps.meta.outputs.prod_flag }} --token="$VERCEL_TOKEN"

  deploy-element-ui:
    name: element-ui playground
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ELEMENT_UI }}
    steps:
      - name: Require Vercel secrets
        run: |
          missing=
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID_ELEMENT_UI"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing"
            echo "Add them under repo Settings → Secrets and variables → Actions"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Resolve environment
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >> "$GITHUB_OUTPUT"
          else
            echo "environment=preview" >> "$GITHUB_OUTPUT"
            echo "prod_flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Pull Vercel project
        working-directory: playgrounds/vue2-element-ui
        run: vercel pull --yes --environment="${{ steps.meta.outputs.environment }}" --token="$VERCEL_TOKEN"

      - name: Build (vercel.json)
        working-directory: playgrounds/vue2-element-ui
        run: vercel build ${{ steps.meta.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy
        working-directory: playgrounds/vue2-element-ui
        run: vercel deploy --prebuilt ${{ steps.meta.outputs.prod_flag }} --token="$VERCEL_TOKEN"
