name: Vercel Playgrounds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Secrets (repository):
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID_ELEMENT_PLUS
#   VERCEL_PROJECT_ID_ELEMENT_UI
#
# Create two Vercel projects linked to this repo, Root Directory:
#   playgrounds/vue3-element-plus
#   playgrounds/vue2-element-ui
# Then copy orgId / projectId from each project's settings (or .vercel/project.json after `vercel link`).

jobs:
  deploy-element-plus:
    name: Element Plus playground
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ELEMENT_PLUS }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project
        run: >
          vercel pull --yes
          --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue3-element-plus

      - name: Build (vercel.json)
        run: >
          vercel build
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue3-element-plus

      - name: Deploy
        run: >
          vercel deploy --prebuilt
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue3-element-plus

  deploy-element-ui:
    name: element-ui playground
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ELEMENT_UI }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Pull Vercel project
        run: >
          vercel pull --yes
          --environment=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue2-element-ui

      - name: Build (vercel.json)
        run: >
          vercel build
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue2-element-ui

      - name: Deploy
        run: >
          vercel deploy --prebuilt
          ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: playgrounds/vue2-element-ui
