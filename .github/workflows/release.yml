name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# npm Trusted Publishing (OIDC)
# Trusted Publisher on each package must match:
#   owner=daguanren21 repo=vformjs workflow=release.yml environment=<empty>
# Do NOT set NPM_TOKEN / registry-url auth — they override OIDC.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    name: Lint · Vitest · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build packages (turbo)
        run: pnpm build

  release:
    name: Changesets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11.x (OIDC needs npm >= 11.5.1).
      # Do NOT set registry-url here: setup-node would write
      # NODE_AUTH_TOKEN=XXXXX into .npmrc and npm prefers that
      # fake token over OIDC exchange → misleading E404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: Clear setup-node placeholder auth
        run: |
          # Defensive: remove any auth token leftovers so OIDC is used.
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete //registry.npmjs.org/:always-auth || true
          unset NODE_AUTH_TOKEN || true
          echo "npm=$(npm -v) node=$(node -v)"
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set? $([ -n \"$ACTIONS_ID_TOKEN_REQUEST_URL\" ] && echo yes || echo no)"

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish (OIDC)
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm run version-packages
      - name: Build packages before publish
        run: pnpm build

      - name: Create Release PR or Publish (OIDC)
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm run version-packages
          # Prefer bare changeset publish (not `pnpm release`) so OIDC env
          # reaches the npm/pnpm publish child process more reliably.
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # Prevent setup-node placeholder token from overriding OIDC.
          NODE_AUTH_TOKEN: ''
