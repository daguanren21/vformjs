name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# npm Trusted Publishing (OIDC)
# Trusted Publisher on each package must match:
#   owner=daguanren21 repo=vformjs workflow=release.yml environment=<empty>
# Do NOT set NPM_TOKEN / registry-url auth — they override OIDC.
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    name: Full quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Run canonical quality gate
        run: pnpm verify

  release:
    name: Changesets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # Node 24 ships npm 11.x (OIDC needs npm >= 11.5.1).
      # Do NOT set registry-url: setup-node would write a placeholder
      # NODE_AUTH_TOKEN into .npmrc and npm prefers that over OIDC → E404.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - name: Clear setup-node placeholder auth
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm config delete //registry.npmjs.org/:always-auth || true
          echo "npm=$(npm -v) node=$(node -v)"
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "ACTIONS_ID_TOKEN_REQUEST_URL=yes"
          else
            echo "ACTIONS_ID_TOKEN_REQUEST_URL=no"
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build packages before publish
        run: pnpm build

      - name: Create Release PR or Publish (OIDC)
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm run version-packages
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # Prevent setup-node placeholder token from overriding OIDC.
          NODE_AUTH_TOKEN: ''
