name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# npm Trusted Publishing (OIDC)：id-token: write
# 首次：本地 npm login 发布 → npm 包设置 Trusted Publisher = release.yml
# 之后 CI 不需要 NPM_TOKEN
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  quality:
    name: Lint · Vitest · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Build packages (turbo)
        run: pnpm build

  release:
    name: Changesets
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports OIDC
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - name: Create Release PR or Publish (OIDC)
        id: changesets
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: pnpm run version-packages
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
